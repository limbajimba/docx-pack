<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Map Microsoft font names to fonts present on this Mac so previews match Word. -->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family"><string>Gill Sans MT</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Gill Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Calibri</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Cambria</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Caladea</string></edit>
  </match>
</fontconfig>
